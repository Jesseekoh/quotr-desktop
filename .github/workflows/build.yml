name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check and tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test

  build:
    name: Build (${{ matrix.name }})
    needs: check
    # Pull requests only run the checks; full bundles are built for main, tags and manual runs.
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            # Oldest supported Ubuntu, so the bundles run on older glibc versions too.
            os: ubuntu-22.04
            bundles: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          - name: windows
            os: windows-latest
            bundles: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: bun install --frozen-lockfile

      # On a version tag this also creates a draft GitHub release with the bundles attached.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Quotr ${{ github.ref_name }}
          releaseBody: See the assets below to download Quotr for Linux or Windows.
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: quotr-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
